
name: Build F1 Next Race APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip -q F1NextRaceWidgetPro-Android-Source.zip -d project
          test -f project/F1NextRaceWidgetPro/app/build.gradle.kts

      - name: Fix widget layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "project/F1NextRaceWidgetPro/app/src/main/res/layout/widget_next_race.xml"
          )
          s = p.read_text()

          pattern = r'<View\s+android:layout_width="4dp"\s+android:layout_height="22dp"\s+android:background="@drawable/accent_bar"\s*/>'

          replacement = '''<TextView
                  android:layout_width="4dp"
                  android:layout_height="22dp"
                  android:background="@drawable/accent_bar"
                  android:text="" />'''

          fixed, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
              raise SystemExit("Could not find the decorative View to patch.")

          p.write_text(fixed)
          print("Widget layout patch applied.")
          PY

      - name: Set Java compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/F1NextRaceWidgetPro/app/build.gradle.kts")
          s = p.read_text()

          if "sourceCompatibility = JavaVersion.VERSION_17" not in s:
              s = s.replace(
                  "android {",
                  """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          p.write_text(s)
          PY

      - name: Build debug APK
        working-directory: project/F1NextRaceWidgetPro
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F1-Next-Race-APK-Fixed
          path: project/F1NextRaceWidgetPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
