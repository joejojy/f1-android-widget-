
name: Build F1 Next Race APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project
        run: |
          unzip -q F1NextRaceWidgetPro-Android-Source.zip -d project
          test -f project/F1NextRaceWidgetPro/app/build.gradle.kts

      - name: Build debug APK
        working-directory: project/F1NextRaceWidgetPro
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: F1-Next-Race-APK
          path: project/F1NextRaceWidgetPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
