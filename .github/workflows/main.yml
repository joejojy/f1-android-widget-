name: Build F1 Next Race APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -q F1NextRaceWidgetPro-Android-Source.zip -d project
          test -f project/F1NextRaceWidgetPro/app/build.gradle.kts

      - name: Build APK
        working-directory: project/F1NextRaceWidgetPro
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: F1-Next-Race-APK
          path: project/F1NextRaceWidgetPro/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
